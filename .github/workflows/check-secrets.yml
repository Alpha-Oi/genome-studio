name: Check Secrets

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  forbidden-files:
    name: Forbidden files check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for forbidden files
        run: |
          fail=0
          for pattern in "*.key" "*.pem" ".env" ".env.*" "secrets/*"; do
            if git ls-files | grep -E "$pattern"; then
              echo "ERROR: forbidden file matching $pattern"
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then exit 1; fi
          echo "OK: no forbidden files tracked"

  large-files:
    name: Large files check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for large files
        run: |
          limit=$((10 * 1024 * 1024))  # 10 MB
          fail=0
          while IFS= read -r f; do
            size=$(stat -c%s "$f")
            if [ "$size" -gt "$limit" ]; then
              echo "LARGE: $f ($size bytes)"
              fail=1
            fi
          done < <(git ls-files)
          if [ "$fail" = "1" ]; then exit 1; fi
          echo "OK: no files over 10 MB tracked"
