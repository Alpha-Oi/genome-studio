# Genome Studio — локальная разработка.
# Запуск: docker compose up

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gs-postgres
    environment:
      POSTGRES_USER: gs
      POSTGRES_PASSWORD: gs
      POSTGRES_DB: gs
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gs -d gs"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: gs-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gs
      MINIO_ROOT_PASSWORD: gs-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: gs-backend-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GS_BUILD: dev
      GS_DEV_OVERRIDE_AVAILABLE: "1"
      GS_DATABASE_URL: postgresql+asyncpg://gs:gs@postgres:5432/gs
      GS_REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/src:/app/backend/src
      - ./core-rs:/app/core-rs
    # Изоляция: только localhost.
    network_mode: "bridge"

volumes:
  postgres-data:
  redis-data:
  minio-data:
