[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "gs-core"
version = "0.0.1"
description = "Genome Studio core — Python bindings"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.12",
]

[tool.maturin]
features = ["python"]
module-name = "gs_core._gs_core"
manifest-path = "Cargo.toml"
