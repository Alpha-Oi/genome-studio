[project]
name = "genome-studio"
version = "0.0.1"
description = "Workbench for genetic engineering researchers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Genome Studio" }]
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ['^\.venv/', '^build/', '^dist/', '^node_modules/', 'alembic/', '^backend/tests/']

# Essential checks (не strict, но ловит реальные ошибки)
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true

# Functions in src/ must have annotations
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Skipped from strict (too noisy for MVP):
# - disallow_any_generics (bare dict/list are OK)
# - disallow_subclassing_any
# - disallow_untyped_calls
# - disallow_untyped_decorators

[[tool.mypy.overrides]]
module = ["reportlab.*", "reportlab.*.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ['^\.venv/', '^build/', '^dist/', '^node_modules/', 'alembic/', '^backend/tests/']

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",     # line length handled by formatter
    "B008",     # function call in default arg (FastAPI Depends)
    "RUF001",   # ambiguous unicode in string - Cyrillic intentional
    "RUF002",   # ambiguous unicode in docstring - Cyrillic intentional
    "RUF003",   # ambiguous unicode in comment - Cyrillic intentional
    "UP042",    # str+Enum is valid; StrEnum migration is separate
]

[tool.ruff.lint.isort]
known-first-party = ["genome_studio"]
[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["N806"]  # gene/protein names like lacI, GAL4 are valid

[tool.ruff.format]
quote-style = "double"
indent-style = "space"