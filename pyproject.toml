[project]
name = "genome-studio"
version = "0.0.1"
description = "Workbench for genetic engineering researchers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Genome Studio" }]
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ['^\.venv/', '^build/', '^dist/', '^node_modules/', '^backend/tests/']

# Essential checks (не strict, но ловит реальные ошибки)
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true

# Functions in src/ must have annotations
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Skipped from strict (too noisy for MVP):
# - disallow_any_generics (bare dict/list are OK)
# - disallow_subclassing_any
# - disallow_untyped_calls
# - disallow_untyped_decorators

[[tool.mypy.overrides]]
module = ["reportlab.*", "reportlab.*.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"