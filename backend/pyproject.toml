[project]
name = "genome-studio-backend"
version = "0.0.1"
description = "Genome Studio backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Genome Studio" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "redis>=5.2",
    "celery>=5.4",
    "structlog>=24.4",
    "typer>=0.15",
    "rich>=13.9",
    "cryptography>=44.0",
    "pynacl>=1.5",
    "pyyaml>=6.0",
    "reportlab>=4.2",
]

[project.optional-dependencies]
bio = [
    "biopython>=1.84",
    "pysam>=0.22",
    "pyfaidx>=0.8",
    "scikit-bio>=0.6",
]
ml = [
    "torch>=2.5",
    "transformers>=4.46",
    "onnxruntime>=1.20",
    "sentence-transformers>=3.3",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "httpx>=0.28",
]

[project.scripts]
genome-studio = "genome_studio.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genome_studio"]